<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Buurman Bas</title>

<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <img class="header-logo" src="Logo_wit-oranje-transparant.png" alt="Buurman Bas">
    <h1>Contactformulier</h1>
    <p>Stuur gerust een bericht. Ik laat zo spoedig mogelijk van me horen.</p>
    <nav class="nav-menu"><a href="index.html">Home</a></nav>
</header>
<section>
    <form action="https://formspree.io/f/xaeevkqr" method="POST">
        <label for="naam">Naam</label>
        <input type="text" id="naam" name="naam" required>

        <label for="email">E-mailadres</label>
        <input type="email" id="email" name="email" required>

        <label for="telefoon">Telefoonnummer (optioneel)</label>
        <input type="tel" id="telefoon" name="telefoon">

        <label for="bericht">Beschrijving van de klus</label>
        <textarea id="bericht" name="bericht"
            placeholder="Omschrijf kort waarmee ik u mogelijk kan helpen."
            required></textarea>

        <div class="buttons">
            <button type="submit" class="button">
                Verstuur
            </button>

            <a href="index.html" class="button">
                Terug naar Home
            </a>
        </div>
    </form>
</section>

</body>
</html>
